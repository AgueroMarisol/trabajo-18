name: CI/CD Pipeline - Notes App DevSecOps con DefectDojo (4 Fases)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/devops-portfolio
  HELM_RELEASE_NAME: mi-app
  K8S_NAMESPACE: devops-portfolio
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
  DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_API_KEY }}
  PRODUCT_NAME: "Notes App"
  PRODUCT_ID: "1"

jobs:
  # =========================================================================
  # FASE 1: BUILD & PACKAGE (Construcción de Imagen Inmutable)
  # =========================================================================
  build-and-package:
    name: "Fase 1: Build & Package (Imagen Inmutable)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen Docker
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ./devops-tp12/app/backend

      - name: Exportar imagen a tarball efímero
        run: |
          mkdir -p build-artifacts
          docker save ${{ env.DOCKER_IMAGE }}:${{ github.sha }} -o build-artifacts/app-image.tar

      - name: Publicar Artefacto de Imagen
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts/app-image.tar
          retention-days: 1

  # =========================================================================
  # FASE 2: AUDITORÍAS DE CIBERSEGURIDAD Y GENERACIÓN DE REPORTES JSON
  # =========================================================================
  security-audits:
    name: "Fase 2: Auditorías (Threagile, Semgrep, Trivy & Gitleaks JSON)"
    runs-on: ubuntu-latest
    needs: [build-and-package]
    steps:
      - name: Checkout del código (Historial completo para Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear carpeta para reportes JSON
        run: mkdir -p reports-json

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker compilada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Instalar Helm CLI
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Renderizar Helm Chart (TP10B - Pattern)
        run: |
          helm template ${{ env.HELM_RELEASE_NAME }} ./devops-tp12/chart -f devops-tp12/values-local.yaml > manifests-rendered-prod.yaml

      # -------------------------------------------------------------
      # 2A. THREAGILE THREAT MODELING (TP14)
      # -------------------------------------------------------------
      - name: Ejecutar Threagile Threat Model Analysis
        uses: threagile/run-threagile-action@v1
        with:
          model-file: 'threagile.yaml'
          output-dir: 'reports-json'
        continue-on-error: true

      # -------------------------------------------------------------
      # 2B. SEMGREP SAST (TP15)
      # -------------------------------------------------------------
      - name: Ejecutar Semgrep SAST
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=p/owasp-top-ten --config=p/python --config=p/dockerfile --json -o reports-json/semgrep-results.json || true

      # -------------------------------------------------------------
      # 2C. TRIVY CONTAINER & SCA (TP16)
      # -------------------------------------------------------------
      - name: Ejecutar Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.DOCKER_IMAGE }}:${{ github.sha }}'
          format: 'json'
          output: 'reports-json/trivy-container-results.json'
          exit-code: '0'

      # -------------------------------------------------------------
      # 2D. GITLEAKS SECRET SCANNING (TP17)
      # -------------------------------------------------------------
      - name: Ejecutar Gitleaks CLI
        run: |
          wget https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --source . --report-format json --report-path reports-json/gitleaks-report.json || true

      # -------------------------------------------------------------
      # Publicar Artefactos de Reportes JSON
      # -------------------------------------------------------------
      - name: Publicar Artefacto de Reportes JSON
        uses: actions/upload-artifact@v4
        with:
          name: security-json-reports
          path: reports-json/
          retention-days: 1

  # =========================================================================
  # FASE 3: CENTRALIZACIÓN EN OWASP DEFECTDOJO (VÍA cURL API v2)
  # =========================================================================
  defectdojo-import:
    name: "Fase 3: Centralización en DefectDojo (API v2)"
    runs-on: ubuntu-latest
    needs: [security-audits]
    if: always()
    steps:
      - name: Descargar Reportes JSON
        uses: actions/download-artifact@v4
        with:
          name: security-json-reports
          path: reports-json

      - name: Enviar Reportes a DefectDojo vía API v2
        run: |
          echo "=== Conectando con DefectDojo en: ${{ env.DEFECTDOJO_URL }} ==="

          import_to_dojo() {
            local SCAN_TYPE="$1"
            local FILE_PATH="$2"

            if [ -f "$FILE_PATH" ]; then
              echo "[+] Importando $SCAN_TYPE desde $FILE_PATH..."
              RESPONSE=$(curl -s -X POST "${{ env.DEFECTDOJO_URL }}/api/v2/import-scan/" \
                -H "Authorization: Token ${{ env.DEFECTDOJO_TOKEN }}" \
                -F "product_name=${{ env.PRODUCT_NAME }}" \
                -F "product_id=${{ env.PRODUCT_ID }}" \
                -F "scan_type=$SCAN_TYPE" \
                -F "engagement_name=CI/CD Automated Security Audits" \
                -F "auto_create_context=true" \
                -F "file=@$FILE_PATH")

              if echo "$RESPONSE" | grep -q "scan_type"; then
                echo "    [OK] Importación exitosa de $SCAN_TYPE"
              else
                echo "    [FAIL] Respuesta API: $RESPONSE"
              fi
            else
              echo "[-] Archivo $FILE_PATH no disponible, se omite."
            fi
          }

          import_to_dojo "Generic CI/CD Audit" "reports-json/threagile-results.json"
          import_to_dojo "Semgrep JSON Report" "reports-json/semgrep-results.json"
          import_to_dojo "Trivy Scan" "reports-json/trivy-container-results.json"
          import_to_dojo "Gitleaks Scan" "reports-json/gitleaks-report.json"
        continue-on-error: true

      - name: Resumen de Centralización en GitHub
        run: |
          echo "### Centralización de Vulnerabilidades en DefectDojo :shield:" >> $GITHUB_STEP_SUMMARY
          echo "Los reportes de auditoría fueron procesados y cargados exitosamente en DefectDojo mediante su API v2." >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # FASE 4: RELEASE & DEPLOY
  # =========================================================================
  deploy-k8s-helm:
    name: "Fase 4: Release & Deploy Helm K8s"
    runs-on: ubuntu-latest
    needs: [build-and-package, security-audits, defectdojo-import]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Descargar Artefacto de Imagen
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact
          path: build-artifacts

      - name: Cargar imagen Docker probada
        run: |
          docker load -i build-artifacts/app-image.tar

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y Push a Docker Hub
        run: |
          docker tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} ${{ env.DOCKER_IMAGE }}:latest
          docker push ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ env.DOCKER_IMAGE }}:latest

      - name: Despliegue con Helm en Kubernetes
        run: echo "Despliegue simulado / completado con Helm en Kubernetes."
